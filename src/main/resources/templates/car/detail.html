<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <h1>[[${car.name}]]</h1>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #333;
            overflow: hidden;
        }

        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>

</head>



<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>
<body>
<main>
    <h1>[[${car.name}]]</h1>
    <nav class="actions">
        <ul>
            <li><a th:href="@{/car/{id}/edit(id=${car.id})}" class="main_b button">Edit</a></li>
            <li>
                <form id="deleteForm" th:action="@{/car/{id}(id=${car.id})}" method="post">
                    <label>
                        <input th:type="submit" th:value="Delete" class="main_b button"
                               th:data-confirm-delete="| Are you sure you want to delete this car ${car.id}|"
                               onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">
                    </label>
                </form>
            </li>
        </ul>
    </nav>

    <div class="details">

        <section style="grid-column: 1 / span 1; grid-row: 1 / span 1;">
            <h2>detail</h2>
            <ul>
                <li>Licence Plate: [[${car.licence_plate}]]</li>
                <li>Model: [[${car.model}]]</li>
                <li>driver: <a th:href="@{/driver/{id}(id=${car.driver.id})}" th:text="${car.driver.name}"></a></li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
