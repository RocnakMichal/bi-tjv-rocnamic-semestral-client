<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create car</title>
    <style th:inline="text">
    </style>
    <script th:inline="javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            var numOptions = $('#driver option').length;
            if (numOptions <= 5) {
                $('#driver').attr('size', numOptions);
            } else {
                $('#driver').attr('size', 5);
            }

            $('form').on('submit', function(e) {
                e.preventDefault();

                var licencePlate = $('#licence_plate').val();

                $.ajax({
                    method: "GET",
                    url: "/car/license-plates/" + licencePlate, // assuming your app runs on the root url
                    async: true,
                })
                    .done(function(isLicensePlateUnique) {
                        if (isLicensePlateUnique === false) {
                            alert('Error: Licence Plate exists! Please enter a different licence plate.');
                        } else {
                            $('form').unbind('submit').submit();
                        }
                    })
                    .fail(function() {
                        alert('AJAX request failed.');
                    });
            });
        });
    </script>
</head>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .button {
            display: inline-block;
            color: black;
            border: solid 2px #ddd;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>Create Car</h1>
    <form action="/car/create" method="post" th:object="${car}">
        <label for="licence_plate">Licence Plate:</label>
        <input type="text" id="licence_plate" name="licence_plate" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50" required><br>

        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>

        <label for="model">Model:</label>
        <input type="text" id="model" name="model" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>

        <label for="boughtIn">bought_in:</label>
        <input type="date" id="boughtIn" name="boughtIn" required><br>

        <label for="driver">Driver:</label>
        <select id="driver" name="driverId">
            <option th:each="driver : ${drivers}" th:value="${driver.id}" th:text="${driver.name}"></option>
        </select><br>

        <input type="submit" class="button" value="Create">
    </form>
</main>
</body>
</html>
