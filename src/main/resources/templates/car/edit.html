<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car edit: [[${car.licence_plate}]]</title>
    <script th:inline="javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script th:inline="javascript">

        $(document).ready(function() {
            var numOptions = $('#driver option').length;
            if (numOptions <= 5) {
                $('#driver').attr('size', numOptions);
            } else {
                $('#driver').attr('size', 5);
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .button {
            display: inline-block;
            color: black;
            border: solid 2px #ddd;
            padding: 10px 20px;
            text-align: center;
        }
    </style>

</head>

<body>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>Editing car [[${car.licence_plate}]] </h1>
    <form action="#" method="post" th:object="${car}">


        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" th:value="${car.brand}" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>


        <label for="model">Model:</label>
        <input type="text" id="model" name="model" th:value="${car.model}" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>

        <label for="boughtIn">bought_in:</label>
        <input type="date" id="boughtIn" name="boughtIn" th:value="${car.boughtIn}" ><br>


        <label for="driver">Driver:</label>
        <select id="driver" name="DriverId" required>
            <option th:each="driver : ${drivers}" th:value="${driver.id}" th:selected="${driver.id == car.driver.id}"
                    th:text="${driver.name}">
            </option>
        </select><br>

        <input type="submit" class="button" value="Edit">
    </form>
</main>
</body>
</html>
