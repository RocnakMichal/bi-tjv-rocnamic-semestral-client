<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>

<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<h1>Car management</h1>
<table class="table">
    <thead>
    <tr>
        <th>LICENCE PLATE</th>
        <th>MODEL</th>
        <th>BRAND</th>
        <th>BOUGHT IN</th>
        <th>DRIVER NAME</th>
        <th>DRIVER SURNAME</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car: ${cars}">
        <td>
            <a th:href="@{/car/{id}(id=${car.id})}" th:text="${car.licence_plate}"></a>
        </td>
        <td th:text="${car.model}"></td>
        <td th:text="${car.brand}"></td>
        <td th:text="${car.boughtIn}"></td>
        <td th:text="${car.driver.name}"></td>
        <td th:text="${car.driver.surname}"></td>
    </tr>
    <tr>
        <td>
            <button><a th:href="@{/car/create}">Create car</a></button>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
