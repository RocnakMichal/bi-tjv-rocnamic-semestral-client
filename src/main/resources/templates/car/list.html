<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<header>
    <nav class="main_nav">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/car">Cars</a></li>
            <li><a href="/driver">Drivers</a></li>
        </ul>
    </nav>
</header>


<body>


<h1>Car management</h1>
<table class="table">
    <thead>
    <tr>
        <th>LICENCE PLATE</th>
        <th>MODEL</th>
        <th>BRAND</th>
        <th>BOUGHT IN</th>
        <th>DRIVER NAME</th>
        <th>DRIVER SURNAME</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car: ${cars}">
        <td>
            <a th:href="@{/car/{id}(id=${car.id})}" th:text="${car.licence_plate}"></a>
        </td>
        <td th:text="${car.model}"></td>
        <td th:text="${car.brand}"></td>
        <td th:text="${car.boughtIn}"></td>
        <td th:text="${car.driver.name}"></td>
        <td th:text="${car.driver.surname}"></td>
    </tr>
    <tr>
        <td>
            <button><a th:href="@{/car/create}">Create car</a></button>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
