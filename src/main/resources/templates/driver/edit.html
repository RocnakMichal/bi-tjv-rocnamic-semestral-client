<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editing driver: [[${driver.surname}]]</title>
    <meta charset="UTF-8">
    <title>Driver detail: [[${driver.name}]]</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .button {
            display: inline-block;
            color: black;
            border: solid 2px #ddd;
            padding: 10px 20px;
            text-align: center;
        }
    </style>

</head>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>Editing driver</h1>
    <form action="#" method="post" th:object="${driver}">
        <label for="name">name:</label>
        <input type="text" id="name" name="name" th:value="${driver.name}" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" th:value="${driver.surname}" pattern="[0-9\p{L}\s]+" minlength="3" maxlength="50"><br>


        <input type="submit" class="button" value="Upravit">
    </form>
</main>
</body>
</html>
</html>
