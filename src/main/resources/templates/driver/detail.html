<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Driver detail: [[${driver.surname}]]</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            nav {
                background-color: #333;
                overflow: hidden;
            }
            nav a {
                float: left;
                display: block;
                color: white;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }
            nav a:hover {
                background-color: #ddd;
                color: black;
            }

            .button {
                display: inline-block;
                color: black;
                border: solid 2px #ddd;
                padding: 10px 20px;
                text-align: center;
            }
        </style>

    </head>

<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>[[${driver.surname}]]</h1>
    <div class="actions">
        <ul>
            <li><a th:href="@{/driver/{id}/edit(id=${driver.id})}" class="main_b button">Upravit</a></li>
            <li>
                <form id="deleteForm" th:action="@{/driver/{id}(id=${driver.id})}" method="post">
                    <label>
                        <input th:type="submit" th:value="Smazat" class="main_b button"
                               th:data-confirm-delete="|Jsi si jistý že chceš smazat jednotku ${driver.name}|"
                               onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">
                    </label>
                </form>
            </li>
        </ul>
    </div>

    <div class="details">

        <section style="grid-column: 1 / span 1; grid-row: 1 / span 1;">
            <h2>detail</h2>
            <ul>
                <li>Name: [[${driver.name}]]</li>
                <li>Surname: [[${driver.surname}]]</li>
            </ul>
        </section>


        <section style="grid-column: 2 / span 1; grid-row: 1 / span 1;">
            <h2>Cars</h2>
            <ul>
                <li th:each="car : ${driver.cars}">
                    <a th:href="@{/car/{id}(id=${car.id})}" th:if="${car.model != null}" th:text="${car.model}"></a>
                    <a th:href="@{/car/{id}(id=${car.id})}" th:unless="${car.model != null}" th:text="${car.id}"></a>
                </li>
            </ul>
        </section>




    </div>
</main>
</body>
</html>
