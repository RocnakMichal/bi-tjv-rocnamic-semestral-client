<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32-driver.png">
</head>

<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>Drivers</h1>
    <table class="main_table">
        <thead>
        <tr>
            <th>NAME</th>
            <th>SURNAME</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="driver: ${drivers}">
            <td>
                <a th:href="@{/driver/{id}(id=${driver.id})}" th:text="${driver.name}"></a>
            </td>
            <td th:text="${driver.surname}"></td>
        </tr>
        <tr>
            <td class="last_row" colspan="2">
                <button><a th:href="@{/driver/create}">Create driver</a></button>
                <button>
                    <a th:href="@{/driver/deleteWithoutCar}" onclick="return confirm('Are you sure you want to delete drivers without cars?');">Delete drivers without cars</a>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
