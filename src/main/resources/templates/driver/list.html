<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Drivers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }



        table {
            width: 100%;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-collapse: collapse;
        }
        .table thead th {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .table tbody td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center
        }
        .table tbody tr:nth-child(even) {
            background-color: #f4f4f4;
        }
        .table tbody td a {
            color: #333;
            text-decoration: none;
        }

        .button {
            display: inline-block;
            color: black;
            border: solid 2px #ddd;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>

<main>
    <h1>Drivers</h1>
    <table class="table">
        <thead>
        <tr>
            <th>NAME</th>
            <th>SURNAME</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="driver: ${drivers}">
            <td>
                <a th:href="@{/driver/{id}(id=${driver.id})}" th:text="${driver.name}"></a>
            </td>
            <td>
            <a th:href="@{/driver/{id}(id=${driver.id})}" th:text="${driver.surname}"></a>
            </td>
        </tr>
        <tr>
            <td class="last_row" colspan="2">
                <a class="button" th:href="@{/driver/create}" role="button">Create driver</a>
                <a class="button" th:href="@{/driver/deleteWithoutCar}" onclick="return confirm('Are you sure you want to delete drivers without cars?');" role="button">Delete drivers without cars</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
