<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Detail: [[${company.name}]]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>
<main>
    <h1 th:text="'Choose Driver: ' + ${company.name}"></h1>
    <form action="#" method="post" th:object="${company}">
        <div th:each="driver : ${drivers}">
            <label>
                <input type="checkbox" name="driverIds" th:value="${driver.id}" th:checked="${company.driverIds.contains(driver.id)}">
                <a th:href="@{/driver/{id}(id=${driver.id})}" target="_blank" th:text="${driver.name}"></a>
            </label>
        </div>
        <button type="submit" class="main_b button">Submit</button>
    </form>
</main>
</body>
</html>
