<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company detail: [[${company.name}]]</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/car}">Cars</a>
    <a th:href="@{/driver}">Drivers</a>
    <a th:href="@{/company}">Companies</a>
</nav>
<body>
<main>
    <h1>[[${company.name}]]</h1>
    <section class="actions">
        <ul>
            <li><a th:href="@{/company/{id}/edit(id=${company.id})}" class="main_b button">Upravit</a></li>
            <li>
                <form id="deleteForm" th:action="@{/company/{id}(id=${company.id})}" method="post">
                    <label>
                        <input th:type="submit" th:value="Smazat" class="main_b button"
                               th:data-confirm-delete="|Jsi si jistý že chceš smazat jednotku ${company.name}|"
                               onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">
                    </label>
                </form>
            </li>
        </ul>
    </section>

    <div class="details">

        <section style="grid-column: 1 / span 1; grid-row: 1 / span 1;">
            <h2>detail</h2>
            <ul>
                <li>Name: [[${company.name}]]</li>
                <li>Number of products: [[${company.number_of_products}]]</li>
            </ul>
        </section>


        <form id="updateProductsForm" th:action="@{/company/{companyId}/updateProduct973600
        s(companyId=${company.id})}" method="post" th:object="${company}">
            <label>
                Number of products to add:
                <input type="number" name="numberToAdd" id="numberToAdd" min="1">
            </label>
            <button type="button" class="main_b button" onclick="updateProducts()">Add Products</button>
        </form>

        <script>
            function updateProducts() {
                var companyId = [[${company.id}]]; // Add this line to get the companyId
                var numberToAdd = document.getElementById("numberToAdd").value;

                // Perform AJAX request to submit the form
                $.ajax({
                    type: "POST",
                    url: "/company/" + companyId ,  // Update the URL with your actual endpoint
                    data: {
                        numberToAdd: numberToAdd
                    },
                    success: function (data) {
                        // Update the content on the page as needed
                        // For example, update the number of products
                        var updatedNumberOfProducts = data.number_of_products;  // Adjust based on the actual response structure

                        // Update the content on the page
                        document.getElementById("numberOfProducts").innerText = updatedNumberOfProducts;
                    },
                    error: function (error) {
                        console.error("Error updating products: ", error);
                    }
                });
            }
        </script>

        <section style="grid-column: 1 / span 1; grid-row: 2 / span 1;">
            <h2>Drivers</h2>
            <ul>
                <li th:each="driver : ${company.drivers}">
                    <a th:href="@{/driver/{id}(id=${driver.id})}" th:text="${driver.name}"></a>
                </li>
            </ul>
            <a th:href="@{/company/{id}/attend(id=${company.id})}" class="main_b button">Select Drivers</a>
        </section>



    </div>
</main>
</body>
</html>
