<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">

    <meta charset="UTF-8">

    <head>
        <meta charset="UTF-8">
        <title>Company detail: [[${company.name}]]</title>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            nav {
                background-color: #333;
                overflow: hidden;
            }
            nav a {
                float: left;
                display: block;
                color: white;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }
            nav a:hover {
                background-color: #ddd;
                color: black;
            }
        </style>
    </head>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/car}">Cars</a>
        <a th:href="@{/driver}">Drivers</a>
        <a th:href="@{/company}">Companies</a>
    </nav>

<main>
    <h1>Companies</h1>
    <table class="main_table">
        <thead>
        <tr>
            <th>NAME</th>
            <th>NUMBER OF PRODUCTS</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="company: ${companys}">
            <td>
                <a th:href="@{/company/{id}(id=${company.id})}" th:text="${company.name}"></a>
            </td>
            <td th:text="${company.number_of_products}"></td>
        </tr>
        <tr>
            <td class="last_row" colspan="2">
                <button><a th:href="@{/company/create}">Create company</a></button>
            </td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
