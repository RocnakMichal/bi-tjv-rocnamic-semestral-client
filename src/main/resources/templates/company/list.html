<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Companies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }


        .table {
            width: 100%;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-collapse: collapse;
        }
        .table thead th {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .table tbody td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center
        }
        .table tbody tr:nth-child(even) {
            background-color: #f4f4f4;
        }
        .table tbody td a {
            color: #333;
            text-decoration: none;
        }

        .button {
            display: inline-block;
            color: black;
            border: solid 2px #ddd;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

    <body>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/car}">Cars</a>
        <a th:href="@{/driver}">Drivers</a>
        <a th:href="@{/company}">Companies</a>
    </nav>

<main>
    <h1>Companies</h1>
    <table class="table">
        <thead>
        <tr>
            <th>NAME</th>
            <th>NUMBER OF PRODUCTS</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="company: ${companys}">
            <td>
                <a th:href="@{/company/{id}(id=${company.id})}" th:text="${company.name}"></a>
            </td>
            <td th:text="${company.number_of_products}"></td>
        </tr>
        <tr>
            <td class="last_row" colspan="2">
                <a class="button" th:href="@{/company/create}" role="button">Create company</a>
            </td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
